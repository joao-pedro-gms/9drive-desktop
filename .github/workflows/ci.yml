name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Re-running the gate on a branch that has not moved is a normal thing to want: a flaky runner,
  # a half-finished rebase, or a release branch cut from an old merge.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # `src-tauri` is a workspace member, so clippy and the test suite link Tauri and need the
      # same Linux system libraries the webview does. Without these the build dies in
      # `glib-sys` long before any of our code is reached.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --assume-yes \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf

      # Keep in step with rust-toolchain.toml (and the msrv in clippy.toml).
      - name: Install Rust toolchain
        # @master is required when the toolchain comes from `with:`; the @rev is the default otherwise.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Fetch dependencies
        run: cargo fetch --locked

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

  node:
    name: node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build frontend
        run: npm run build